<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <style>
      /* 1. GERAKAN LABA-LABA MERAYAP DARI KANAN KE KIRI (0% - 58%) */
      @keyframes crawlSequence {
        0% { transform: translate(1400px, 210px); opacity: 1; }
        56% { transform: translate(150px, 210px); opacity: 1; }
        58% { transform: translate(50px, 210px); opacity: 0; }
        100% { transform: translate(50px, 210px); opacity: 0; }
      }

      /* Kaki laba-laba melangkah dinamis saat merayap */
      @keyframes spiderLegCrawl {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.02, 0.98) rotate(2deg); }
      }

      /* 2. GERAKAN BERGELANTUNGAN SETELAH MAKAN (60% - 94%) */
      @keyframes webHangSequence {
        0%, 59% { transform: translate(600px, -300px); opacity: 0; }
        62% { transform: translate(600px, 190px); opacity: 1; }
        68% { transform: translate(600px, 175px); opacity: 1; }
        76% { transform: translate(585px, 185px) rotate(-6deg); opacity: 1; }
        84% { transform: translate(615px, 185px) rotate(6deg); opacity: 1; }
        90% { transform: translate(600px, 180px) rotate(0deg); opacity: 1; }
        95% { transform: translate(600px, -350px); opacity: 1; }
        98%, 100% { transform: translate(600px, -350px); opacity: 0; }
      }

      /* Tali jaring laba-laba saat bergelantungan */
      @keyframes webStringDrop {
        0%, 59% { stroke-dashoffset: 350; opacity: 0; }
        62% { stroke-dashoffset: 0; opacity: 0.9; }
        90% { stroke-dashoffset: 0; opacity: 0.9; }
        95% { stroke-dashoffset: 350; opacity: 0; }
        100% { stroke-dashoffset: 350; opacity: 0; }
      }

      /* 3. TIMING MAKAN HURUF: HANYA HILANG SAAT LABA-LABA LEWAT */
      /* Huruf B2 (x=850) kena mulut di ~26% */
      @keyframes eatB2 {
        0%, 25.5% { opacity: 1; transform: scale(1); }
        26.5% { opacity: 0.5; transform: scale(1.1) skewX(-15deg); }
        27.5%, 96% { opacity: 0; transform: scale(0); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      /* Huruf I (x=730) kena mulut di ~32% */
      @keyframes eatI {
        0%, 31.5% { opacity: 1; transform: scale(1); }
        32.5% { opacity: 0.5; transform: scale(1.1) skewX(-15deg); }
        33.5%, 96% { opacity: 0; transform: scale(0); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      /* Huruf B1 (x=600 - Tepat di Tengah) kena mulut di ~38% */
      @keyframes eatB1 {
        0%, 37.5% { opacity: 1; transform: scale(1); }
        38.5% { opacity: 0.5; transform: scale(1.1) skewX(-15deg); }
        39.5%, 96% { opacity: 0; transform: scale(0); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      /* Huruf A (x=460) kena mulut di ~45% */
      @keyframes eatA {
        0%, 44.5% { opacity: 1; transform: scale(1); }
        45.5% { opacity: 0.5; transform: scale(1.1) skewX(-15deg); }
        46.5%, 96% { opacity: 0; transform: scale(0); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      /* Huruf H (x=320) kena mulut di ~51% */
      @keyframes eatH {
        0%, 50.5% { opacity: 1; transform: scale(1); }
        51.5% { opacity: 0.5; transform: scale(1.1) skewX(-15deg); }
        52.5%, 96% { opacity: 0; transform: scale(0); }
        98%, 100% { opacity: 1; transform: scale(1); }
      }

      .letter {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 130px;
        font-weight: 900;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .letter-glow {
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.45));
      }

      .letter-h  { animation: eatH 10s infinite linear; }
      .letter-a  { animation: eatA 10s infinite linear; }
      .letter-b1 { animation: eatB1 10s infinite linear; }
      .letter-i  { animation: eatI 10s infinite linear; }
      .letter-b2 { animation: eatB2 10s infinite linear; }

      .spider-crawler {
        animation: crawlSequence 10s infinite linear;
      }
      .spider-pulse {
        animation: spiderLegCrawl 0.22s infinite ease-in-out;
        transform-origin: 0 0;
      }

      .spider-hanger {
        animation: webHangSequence 10s infinite ease-in-out;
        transform-origin: top center;
      }
      .web-thread {
        stroke-dasharray: 350;
        animation: webStringDrop 10s infinite ease-in-out;
      }
    </style>

    <!-- SILUET SPIDER-MAN RAIMI RAKSASA (SKALA 2.85x) -->
    <g id="raimi-spider-shape">
      <g class="spider-pulse" transform="scale(2.85)">
        <g transform="rotate(-90) translate(-100, -48)">
          <!-- Badan & Perut Merah Glowing -->
          <path d="M100,55 C96,65 92,72 90,82 C88,90 92,105 94,115 C96,125 98,140 100,158 C102,140 104,125 106,115 C108,105 112,90 110,82 C108,72 104,65 100,55 Z" fill="#E23636" filter="drop-shadow(0 0 16px rgba(226, 54, 54, 0.95))" />
          
          <!-- Taring / Mulut Tajam -->
          <polygon points="100,44 95,54 105,54" fill="#E23636" />
          <polygon points="98,40 94,47 97,47" fill="#FFFFFF" />
          <polygon points="102,40 106,47 103,47" fill="#FFFFFF" />

          <!-- Kaki Atas Depan -->
          <path d="M96,68 L68,48 L76,16 C76,16 68,36 71,52 L94,74 Z" fill="#E23636" filter="drop-shadow(0 0 8px rgba(226, 54, 54, 0.8))" />
          <path d="M93,75 L56,58 L46,24 C46,24 43,48 55,68 L90,82 Z" fill="#E23636" filter="drop-shadow(0 0 8px rgba(226, 54, 54, 0.8))" />

          <!-- Kaki Bawah Belakang Panjang Meruncing -->
          <path d="M92,86 L48,82 L34,138 C34,138 46,104 59,96 L92,93 Z" fill="#E23636" filter="drop-shadow(0 0 8px rgba(226, 54, 54, 0.8))" />
          <path d="M94,97 L72,112 L70,188 C70,188 78,142 85,122 L96,106 Z" fill="#E23636" filter="drop-shadow(0 0 8px rgba(226, 54, 54, 0.8))" />

          <!-- Kaki Kanan Simetris -->
          <path d="M104,68 L132,48 L124,16 C124,16 132,36 129,52 L106,74 Z" fill="#E23636" filter="drop-shadow(0 0 8px rgba(226, 54, 54, 0.8))" />
          <path d="M107,75 L144,58 L154,24 C154,24 157,48 145,68 L110,82 Z" fill="#E23636" filter="drop-shadow(0 0 8px rgba(226, 54, 54, 0.8))" />
          <path d="M108,86 L152,82 L166,138 C166,138 154,104 141,96 L108,93 Z" fill="#E23636" filter="drop-shadow(0 0 8px rgba(226, 54, 54, 0.8))" />
          <path d="M106,97 L128,112 L130,188 C130,188 122,142 115,122 L104,106 Z" fill="#E23636" filter="drop-shadow(0 0 8px rgba(226, 54, 54, 0.8))" />
        </g>
      </g>
    </g>
  </defs>

  <!-- BACKGROUND GELAP GITHUB -->
  <rect width="100%" height="100%" fill="#0d1117" rx="18" />
  
  <!-- JARING LABA-LABA SUDUT -->
  <path d="M0,0 L260,0 M0,0 L0,260 M0,0 L200,200 M0,90 Q90,90 90,0 M0,180 Q180,180 180,0" stroke="#21262d" stroke-width="2.5" fill="none" opacity="0.6" />

  <!-- TEKS BALOK: H A B I B (PAS TEPAT DI TENGAH CANVAS) -->
  <g class="letter-glow">
    <text x="320" y="210" class="letter letter-h">H</text>
    <text x="460" y="210" class="letter letter-a">A</text>
    <text x="600" y="210" class="letter letter-b1">B</text>
    <text x="730" y="210" class="letter letter-i">I</text>
    <text x="850" y="210" class="letter letter-b2">B</text>
  </g>

  <!-- FASE 1: LABA-LABA RAKSASA MERAYAP HORIZONTAL MEMAKAN HURUF -->
  <g class="spider-crawler">
    <use href="#raimi-spider-shape" />
  </g>

  <!-- FASE 2: LABA-LABA BERGELANTUNGAN DI TENGAH SETELAH MAKAN SELESAI -->
  <!-- Tali Jaring Menjuntai dari Langit-Langit -->
  <line x1="600" y1="0" x2="600" y2="190" stroke="#ffffff" stroke-width="2.5" class="web-thread" filter="drop-shadow(0 0 6px #ffffff)" />
  
  <g class="spider-hanger">
    <!-- Spider bergelantungan menghadap vertikal natural dengan jaring terikat di bagian atas -->
    <g transform="translate(0, -60) scale(0.9)">
      <use href="#raimi-spider-shape" transform="rotate(90)" />
    </g>
  </g>
</svg>
